services:
  - type: web
    name: navbatbor
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
